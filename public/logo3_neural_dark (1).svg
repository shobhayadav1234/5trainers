<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" rx="20" fill="#0C1220"/>
  <!-- Neural nodes layer 1 -->
  <circle cx="190" cy="140" r="10" fill="#10B981" opacity="0.9"/>
  <circle cx="190" cy="185" r="10" fill="#10B981" opacity="0.9"/>
  <circle cx="190" cy="230" r="10" fill="#10B981" opacity="0.9"/>
  <!-- Neural nodes layer 2 -->
  <circle cx="270" cy="125" r="13" fill="#10B981"/>
  <circle cx="270" cy="185" r="13" fill="#10B981"/>
  <circle cx="270" cy="245" r="13" fill="#10B981"/>
  <!-- Neural nodes layer 3 -->
  <circle cx="360" cy="155" r="13" fill="#FBBF24"/>
  <circle cx="360" cy="215" r="13" fill="#FBBF24"/>
  <!-- Neural nodes layer 4 -->
  <circle cx="440" cy="125" r="10" fill="#818CF8" opacity="0.85"/>
  <circle cx="440" cy="185" r="10" fill="#818CF8" opacity="0.85"/>
  <circle cx="440" cy="245" r="10" fill="#818CF8" opacity="0.85"/>
  <!-- Neural nodes layer 5 -->
  <circle cx="510" cy="155" r="13" fill="#6366F1"/>
  <circle cx="510" cy="215" r="13" fill="#6366F1"/>
  <!-- Connections L1-L2 -->
  <line x1="200" y1="140" x2="257" y2="128" stroke="#10B981" stroke-width="1.2" opacity="0.4"/>
  <line x1="200" y1="140" x2="257" y2="185" stroke="#10B981" stroke-width="1.2" opacity="0.4"/>
  <line x1="200" y1="185" x2="257" y2="128" stroke="#10B981" stroke-width="1.2" opacity="0.3"/>
  <line x1="200" y1="185" x2="257" y2="185" stroke="#10B981" stroke-width="1.2" opacity="0.4"/>
  <line x1="200" y1="185" x2="257" y2="245" stroke="#10B981" stroke-width="1.2" opacity="0.3"/>
  <line x1="200" y1="230" x2="257" y2="185" stroke="#10B981" stroke-width="1.2" opacity="0.4"/>
  <line x1="200" y1="230" x2="257" y2="245" stroke="#10B981" stroke-width="1.2" opacity="0.4"/>
  <!-- Connections L2-L3 -->
  <line x1="283" y1="125" x2="347" y2="157" stroke="#6EE7B7" stroke-width="1.2" opacity="0.4"/>
  <line x1="283" y1="185" x2="347" y2="157" stroke="#6EE7B7" stroke-width="1.2" opacity="0.4"/>
  <line x1="283" y1="185" x2="347" y2="213" stroke="#6EE7B7" stroke-width="1.2" opacity="0.4"/>
  <line x1="283" y1="245" x2="347" y2="213" stroke="#6EE7B7" stroke-width="1.2" opacity="0.4"/>
  <!-- Connections L3-L4 -->
  <line x1="373" y1="157" x2="430" y2="127" stroke="#FDE68A" stroke-width="1.2" opacity="0.4"/>
  <line x1="373" y1="157" x2="430" y2="185" stroke="#FDE68A" stroke-width="1.2" opacity="0.4"/>
  <line x1="373" y1="213" x2="430" y2="185" stroke="#FDE68A" stroke-width="1.2" opacity="0.4"/>
  <line x1="373" y1="213" x2="430" y2="245" stroke="#FDE68A" stroke-width="1.2" opacity="0.4"/>
  <!-- Connections L4-L5 -->
  <line x1="450" y1="125" x2="497" y2="157" stroke="#A5B4FC" stroke-width="1.2" opacity="0.4"/>
  <line x1="450" y1="185" x2="497" y2="157" stroke="#A5B4FC" stroke-width="1.2" opacity="0.4"/>
  <line x1="450" y1="185" x2="497" y2="213" stroke="#A5B4FC" stroke-width="1.2" opacity="0.4"/>
  <line x1="450" y1="245" x2="497" y2="213" stroke="#A5B4FC" stroke-width="1.2" opacity="0.4"/>
  <!-- Wordmark -->
  <text x="580" y="172" font-family="'Trebuchet MS', Arial, sans-serif" font-size="52" font-weight="700" fill="#F1F5F9" letter-spacing="2">SKILL</text>
  <text x="580" y="228" font-family="'Trebuchet MS', Arial, sans-serif" font-size="52" font-weight="200" fill="#10B981" letter-spacing="2">NEXUS</text>
  <!-- Tagline -->
  <text x="400" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6EE7B7" letter-spacing="1.2">Where Data Science + AI + Students + Industry Connect</text>
  <!-- Accent bars -->
  <rect x="220" y="340" width="90" height="2.5" rx="1.5" fill="#10B981"/>
